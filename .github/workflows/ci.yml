name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: local
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://root:mysecretpassword@localhost:5433/local
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use
      EMAIL_PROVIDER: console

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Install browser for component tests
        run: bunx playwright install --with-deps chromium

      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run test:e2e
      - run: bun run build
